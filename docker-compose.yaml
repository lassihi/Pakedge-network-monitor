version: "3.8"
services:
  pakedge:
    image: pakedge-monitor:runtime
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PAKEDGE_USER=${PAKEDGE_USER}
      - PAKEDGE_PASS=${PAKEDGE_PASS}
    volumes:
      - ./:/app
      - ./data/network.db:/app/src/pakedge-monitor/network.db