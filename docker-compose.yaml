services:
  pakedge:
    image: pakedge-monitor:runtime
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PAKEDGE_USER=${PAKEDGE_USER}
      - PAKEDGE_PASS=${PAKEDGE_PASS}
      - PAKEDGE_DB=/data/network.db
    volumes:
      - ./:/app
      - ./data:/data